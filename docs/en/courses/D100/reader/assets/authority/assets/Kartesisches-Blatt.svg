<?xml version="1.0" encoding="utf-8" standalone="no" ?>
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="-325 -225 550 550"
     width="440"
     height="440">
<title>Kartesisches Blatt</title>
<desc>
	This is the file
	   http://commons.wikimedia.org/wiki/File:Kartesisches-Blatt.svg
	It shows the curve
		x^3 + y^3 - 3axy = 0 for a=1
</desc>
<defs>

<path id="tick-y" d="M-0.08 0 H0.08" />
<use  id="tick-x" xlink:href="#tick-y" transform="rotate(90)"/>
<g id="pack1">
	<!-- non-integral ticks -->
	<path stroke="gray"  stroke-width="0.003" d="M-4 0.25 H4 M-4 0.5 H4 M-4 0.75 H4"/>
	<!-- non-integral gridline -->
	<path stroke="black" stroke-width="0.01"  d="M-0.05 0.25 H0.05 M-0.05 0.5 H0.05 M-0.05 0.75 H0.05"/>
</g>
<g id="pack2">
	<use xlink:href="#pack1"/>
	<use xlink:href="#pack1" y="1"/>
	<use xlink:href="#pack1" y="2"/>
	<use xlink:href="#pack1" y="3"/>
</g>
<g id="pack4">
	<use xlink:href="#pack2"/>
	<use xlink:href="#pack2" transform="rotate(180)"/>
</g>
<style type="text/css">
	text {font-size:22px;}
	.it {font-style:italic; font-size:25px;}
	.curve {stroke:#3a3; stroke-opacity:0.7; stroke-width:0.04; }
	.asymp {stroke:#55f; stroke-opacity:0.7; stroke-width:0.025; stroke-dasharray:0.2 0.2;}
</style>
</defs>
<!-- ################################################################### -->
<!-- Background -->
<rect x="-325" y="-225" width="100%" height="100%" fill="white" fill-opacity="0.7" />

<g fill="none" transform="scale(100 -100)">
	<!-- coarse Grid -->
	<g stroke="gray" stroke-width="0.008">
		<path d="M-4 2 H3 M-4 1 H3 M-4 -1 H3 M-4 -2 H3 M-4 -3 H3"/>
		<path d="M-3 -4 V3 M-2 -4 V3 M-1 -4 V3 M1 -4 V3 M2 -4 V3"/>
	</g>
	<!-- fine Grid and fine Ticks -->
	<use xlink:href="#pack4"/>
	<use xlink:href="#pack4" transform="rotate(90)"/>
	<!-- Axes -->
	<g stroke="black" stroke-width="0.025" >
		<!-- x-Axis -->
		<path d="M -4 0  H3"/>
		<!-- y-Axis -->
		<path d="M 0 -4 V3" />
	</g>
	<!-- Ticks -->
	<g stroke="black" stroke-width="0.02">
		<!-- Ticks for x-Axis -->
		<use xlink:href="#tick-x" x="-3" />
		<use xlink:href="#tick-x" x="-2" />
		<use xlink:href="#tick-x" x="-1" />
		<use xlink:href="#tick-x" x="1" />
		<use xlink:href="#tick-x" x="2" />
		<!-- Ticks for y-Axis -->
		<use xlink:href="#tick-y" y="-3" />
		<use xlink:href="#tick-y" y="-2" />
		<use xlink:href="#tick-y" y="-1" />
		<use xlink:href="#tick-y" y="1" />
		<use xlink:href="#tick-y" y="2" />
    </g>
	<path class="asymp" d="M3 -4 L -4 3" />
	<!--
	function u (t) {
     var t1 = 3*t*(1+t);
     var s = t1/(1+t1);
     return s;
  }

    x(t) = -(1+t)*u(t)
	y(t) = t*u(t)
	t = -4 ... -1
	t = -1 ... 0
	t =  0 ... 3
	-->
	<path class="curve" d="M 2.919,-3.892 C 2.817,-3.788 2.715,-3.685 2.613,-3.581 C 2.511,-3.476 2.408,-3.372 2.306,-3.267 C 2.203,-3.161 2.101,-3.056 1.998,-2.949 C 1.895,-2.842 1.792,-2.735 1.688,-2.626 C 1.585,-2.518 1.481,-2.408 1.378,-2.296 C 1.274,-2.184 1.17,-2.07 1.065,-1.953 C 0.961,-1.836 0.857,-1.716 0.753,-1.59 C 0.649,-1.464 0.546,-1.332 0.445,-1.188 C 0.344,-1.042 0.246,-0.886 0.162,-0.701 C 0.075,-0.509 0,-0.292 0,0 C 0,0.1 0.01,0.211 0.037,0.333 C 0.065,0.457 0.11,0.593 0.185,0.738 C 0.261,0.887 0.369,1.046 0.511,1.192 C 0.658,1.342 0.845,1.477 1.029,1.543 C 1.217,1.611 1.402,1.598 1.5,1.5 C 1.598,1.402 1.611,1.217 1.543,1.029 C 1.477,0.845 1.342,0.658 1.192,0.511 C 1.046,0.369 0.887,0.261 0.738,0.185 C 0.593,0.11 0.457,0.065 0.333,0.037 C 0.211,0.01 0.1,0 0,0 C -0.292,0 -0.509,0.075 -0.701,0.162 C -0.886,0.246 -1.042,0.344 -1.188,0.445 C -1.332,0.546 -1.464,0.649 -1.59,0.753 C -1.716,0.857 -1.836,0.961 -1.953,1.065 C -2.07,1.17 -2.184,1.274 -2.296,1.378 C -2.408,1.481 -2.518,1.585 -2.626,1.688 C -2.735,1.792 -2.842,1.895 -2.949,1.998 C -3.056,2.101 -3.161,2.203 -3.267,2.306 C -3.372,2.408 -3.476,2.511 -3.581,2.613 C -3.685,2.715 -3.788,2.817 -3.892,2.919" />

</g>
<!-- Labels for x-Axis -->
<!-- &#8722; = &minus; -->
<g style="text-anchor:middle" transform="translate(0 30)">
  <text x="-300">&#8722;3</text>
  <text x="-200">&#8722;2</text>
  <text x="-100">&#8722;1</text>
  <text x="100">1</text>
  <text x="200">2</text>
  <text x="200" y="-45" stroke="white" fill="white" stroke-opacity="0.6" stroke-width="5"><tspan class="it">x</tspan></text>
  <text x="200" y="-45"><tspan class="it">x</tspan></text>
</g>
<!-- Labels for y-Axis -->
<g style="text-anchor:end" transform="translate(-12 7)">
  <text y="-200">2</text>
  <text y="-100">1</text>
  <text y="100">&#8722;1</text>
  <text y="200">&#8722;2</text>
  <text y="300">&#8722;3</text>
  <text x="40" y="-200" stroke="white" fill="none" stroke-opacity="0.6" stroke-width="5"><tspan class="it">y</tspan></text>
  <text x="40" y="-200"><tspan class="it">y</tspan></text>
</g>
</svg>
