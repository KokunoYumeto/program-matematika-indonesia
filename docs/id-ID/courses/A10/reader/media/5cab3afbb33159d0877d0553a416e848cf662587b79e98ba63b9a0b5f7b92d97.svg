<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 500"
     width="100%"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="ea2-c0325-title ea2-c0325-desc"
     style="max-width:1200px;height:auto">
  <title id="ea2-c0325-title">Penyelesaian pertidaksamaan adalah semua bilangan real</title>
  <desc id="ea2-c0325-desc">Pertidaksamaan dua per lima z dikurangi satu per tiga z lebih kecil daripada satu per lima belas z ditambah tiga per lima disederhanakan menjadi nol lebih kecil daripada tiga per lima. Pernyataan ini selalu benar, sehingga semua bilangan real merupakan penyelesaian. Garis bilangan penuh memiliki panah ke kiri dan ke kanan. Notasi intervalnya adalah negatif tak hingga sampai tak hingga.</desc>

  <rect x="1" y="1" width="1198" height="498" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle">
    <text x="600" y="54" font-size="30" font-weight="700">Penyelesaian: semua bilangan real</text>

    <text x="600" y="112" font-size="26">(2/5)z − (1/3)z &lt; (1/15)z + 3/5</text>
    <text x="600" y="154" font-size="25">(1/15)z &lt; (1/15)z + 3/5</text>
    <text x="600" y="198" font-size="29" font-weight="700">0 &lt; 3/5</text>
    <text x="600" y="236" font-size="23">Pernyataan ini selalu benar untuk setiap nilai z.</text>
  </g>

  <g aria-hidden="true" stroke="#075985" fill="#075985">
    <line x1="122" y1="344" x2="1078" y2="344" stroke-width="10" stroke-linecap="round"/>
    <path d="M 88 344 L 135 317 L 135 371 Z"/>
    <path d="M 1112 344 L 1065 317 L 1065 371 Z"/>
  </g>

  <g aria-hidden="true" stroke="#111827" stroke-width="3" fill="none">
    <line x1="300" y1="327" x2="300" y2="361"/>
    <line x1="450" y1="327" x2="450" y2="361"/>
    <line x1="600" y1="323" x2="600" y2="365"/>
    <line x1="750" y1="327" x2="750" y2="361"/>
    <line x1="900" y1="327" x2="900" y2="361"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle" aria-hidden="true">
    <text x="300" y="397" font-size="22">−2</text>
    <text x="450" y="397" font-size="22">−1</text>
    <text x="600" y="397" font-size="22">0</text>
    <text x="750" y="397" font-size="22">1</text>
    <text x="900" y="397" font-size="22">2</text>
    <text x="88" y="397" font-size="25">−∞</text>
    <text x="1112" y="397" font-size="25">∞</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle">
    <text x="600" y="438" font-size="22">Seluruh garis bilangan termasuk dalam himpunan penyelesaian.</text>
    <text x="600" y="477" font-size="29" font-weight="700">Notasi interval: (−∞, ∞)</text>
  </g>
</svg>
