<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="460" viewBox="0 0 1300 460" role="img" aria-labelledby="title desc">
  <title id="title">Tabel cek diri untuk tujuan pembelajaran subbab</title>
  <desc id="desc">Tabel enam baris dan empat kolom. Kolom penilaian diri bertajuk Dengan yakin, Dengan sedikit bantuan, dan Tidak—saya belum memahaminya. Lima baris tujuan membahas sifat hasil bagi, eksponen nol, pemangkatan hasil bagi, beberapa sifat sekaligus, dan pembagian monomial.</desc>
  <rect width="1300" height="460" fill="#ffffff"/>
  <rect x="0" y="0" width="1300" height="100" fill="#acd8d5"/>
  <g stroke="#249da2" stroke-width="4" fill="none">
    <rect x="2" y="2" width="1296" height="456"/>
    <line x1="590" y1="0" x2="590" y2="460"/>
    <line x1="820" y1="0" x2="820" y2="460"/>
    <line x1="1060" y1="0" x2="1060" y2="460"/>
    <line x1="0" y1="100" x2="1300" y2="100"/>
    <line x1="0" y1="172" x2="1300" y2="172"/>
    <line x1="0" y1="244" x2="1300" y2="244"/>
    <line x1="0" y1="316" x2="1300" y2="316"/>
    <line x1="0" y1="388" x2="1300" y2="388"/>
  </g>
  <g fill="#111111" font-family="Arial, Helvetica, sans-serif">
    <text x="14" y="60" font-size="30">Saya dapat…</text>
    <text x="705" y="58" text-anchor="middle" font-size="28" font-weight="700">Dengan yakin</text>
    <text x="940" y="42" text-anchor="middle" font-size="26" font-weight="700">
      <tspan x="940" dy="0">Dengan sedikit</tspan><tspan x="940" dy="31">bantuan</tspan>
    </text>
    <text x="1180" y="27" text-anchor="middle" font-size="24" font-weight="700">
      <tspan x="1180" dy="0">Tidak—saya belum</tspan><tspan x="1180" dy="29">memahaminya!</tspan>
    </text>
    <g font-size="25">
      <text x="14" y="130"><tspan x="14" dy="0">Menyederhanakan ekspresi menggunakan Sifat</tspan><tspan x="14" dy="29">Hasil Bagi untuk Eksponen.</tspan></text>
      <text x="14" y="216">Menyederhanakan ekspresi dengan eksponen nol.</text>
      <text x="14" y="274"><tspan x="14" dy="0">Menyederhanakan ekspresi menggunakan Sifat</tspan><tspan x="14" dy="29">Pemangkatan Hasil Bagi.</tspan></text>
      <text x="14" y="346"><tspan x="14" dy="0">Menyederhanakan ekspresi dengan menerapkan</tspan><tspan x="14" dy="29">beberapa sifat.</tspan></text>
      <text x="14" y="432">Membagi monomial.</text>
    </g>
  </g>
</svg>
