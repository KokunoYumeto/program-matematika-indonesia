<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="414" viewBox="0 0 350 414" role="img" aria-labelledby="title desc">
  <title id="title">Dua cara menyederhanakan a pangkat m dibagi a pangkat m</title>
  <desc id="desc">Kolom kiri menggunakan sifat hasil bagi sehingga a pangkat m dikurangi m menjadi a pangkat nol. Kolom kanan mencoret m faktor a yang sama pada pembilang dan penyebut sehingga hasilnya satu.</desc>
  <rect width="350" height="414" fill="#ffffff"/>
  <g fill="#111111" stroke="#111111" stroke-width="2" font-family="Cambria Math, STIX Two Math, Times New Roman, serif">
    <g transform="translate(30 25)">
      <text x="0" y="30" font-size="36" font-style="italic">a<tspan baseline-shift="super" font-size="22">m</tspan></text>
      <line x1="-4" y1="42" x2="45" y2="42"/>
      <text x="0" y="78" font-size="36" font-style="italic">a<tspan baseline-shift="super" font-size="22">m</tspan></text>
    </g>
    <g transform="translate(230 25)">
      <text x="0" y="30" font-size="36" font-style="italic">a<tspan baseline-shift="super" font-size="22">m</tspan></text>
      <line x1="-4" y1="42" x2="45" y2="42"/>
      <text x="0" y="78" font-size="36" font-style="italic">a<tspan baseline-shift="super" font-size="22">m</tspan></text>
    </g>
    <text x="10" y="223" font-size="36" font-style="italic">a<tspan baseline-shift="super" font-size="22">m−m</tspan></text>
    <g transform="translate(170 150)" font-size="30" font-style="italic">
      <text x="0" y="35">a · a · ⋯ · a</text>
      <line x1="-8" y1="48" x2="166" y2="48"/>
      <text x="0" y="86">a · a · ⋯ · a</text>
      <g stroke="#111111" stroke-width="2">
        <line x1="-2" y1="5" x2="24" y2="40"/>
        <line x1="38" y1="5" x2="64" y2="40"/>
        <line x1="138" y1="5" x2="164" y2="40"/>
        <line x1="-2" y1="56" x2="24" y2="91"/>
        <line x1="38" y1="56" x2="64" y2="91"/>
        <line x1="138" y1="56" x2="164" y2="91"/>
      </g>
    </g>
    <text x="10" y="390" font-size="36" font-style="italic">a<tspan baseline-shift="super" font-size="22">0</tspan></text>
    <text x="235" y="390" font-size="36" font-style="normal">1</text>
  </g>
  <g fill="#2ccbc7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-style="italic">
    <text x="195" y="142">m faktor</text>
    <text x="195" y="280">m faktor</text>
  </g>
</svg>
