name: Deploy reader to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "build/reader/**"
      - "program-navigation.json"
      - "scripts/program_navigation.py"
      - "scripts/reseal_reader_manifests.py"
      - "output/pdf/01_Pengantar_Pemodelan_Matematika_Edisi_Bahasa_Indonesia_Lengkap.pdf"
      - "LICENSE.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the frozen reader source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble the static reader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R build/reader/. _site/
          cp site/index.html _site/index.html
          cp site/site.css _site/site.css
          cp output/pdf/01_Pengantar_Pemodelan_Matematika_Edisi_Bahasa_Indonesia_Lengkap.pdf _site/Pengantar_Pemodelan_Matematika_Edisi_Bahasa_Indonesia_Lengkap.pdf
          cp LICENSE.md _site/LICENSE.md
          touch _site/.nojekyll

      - name: Add bilingual programme and source navigation
        run: |
          python scripts/program_navigation.py inject --config program-navigation.json _site
          python scripts/program_navigation.py check --config program-navigation.json _site
          python scripts/reseal_reader_manifests.py reseal _site
          python scripts/reseal_reader_manifests.py check _site

      - name: Verify the assembled surface
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/site.css
          test -s _site/Pengantar_Pemodelan_Matematika_Edisi_Bahasa_Indonesia_Lengkap.pdf
          test "$(find _site -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 26
          test "$(find _site -name '*.html' | wc -l)" -eq 27
          test "$(sha256sum _site/Pengantar_Pemodelan_Matematika_Edisi_Bahasa_Indonesia_Lengkap.pdf | cut -d' ' -f1)" = "f62218d51c97bd86f94ac80c6fe179a2b535be5cd8f8bcf2f402764421597cf3"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
